```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Suppliers | VendorOS AI</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1f2937;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: #0b1220;
            color: white;
            padding: 24px 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 12px 28px;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: linear-gradient(135deg, #4f7cff, #7c5cff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
        }

        .brand-text {
            font-size: 18px;
            font-weight: 750;
        }

        .brand-text span {
            color: #6d8cff;
        }

        .nav-section {
            margin-top: 10px;
        }

        .nav-label {
            font-size: 11px;
            color: #71809a;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0 13px;
            margin-bottom: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 13px;
            margin: 4px 0;
            border-radius: 10px;
            color: #9aa6bb;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .nav-item:hover {
            background: #151e31;
            color: white;
        }

        .nav-item.active {
            background: #1c2942;
            color: white;
        }

        .nav-icon {
            width: 20px;
            text-align: center;
            font-size: 16px;
        }

        .sidebar-bottom {
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: 20px;
        }

        .logout {
            cursor: pointer;
        }

        /* MAIN */

        .main {
            margin-left: 250px;
            min-height: 100vh;
            padding: 30px 40px;
        }

        /* TOPBAR */

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .title h1 {
            font-size: 30px;
            font-weight: 800;
        }

        .title p {
            margin-top: 6px;
            color: #64748b;
            font-size: 14px;
        }

        .add-btn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.18s ease;
        }

        .add-btn:hover {
            background: #4f46e5;
            transform: translateY(-1px);
        }

        /* SUMMARY */

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(15, 23, 42, 0.05);
        }

        .card-label {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 28px;
            font-weight: 800;
        }

        /* TABLE */

        .table-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 5px 20px rgba(15, 23, 42, 0.05);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .table-header h2 {
            font-size: 19px;
        }

        .search {
            width: 260px;
            padding: 10px 13px;
            border: 1px solid #dbe1ea;
            border-radius: 9px;
            outline: none;
            font-family: inherit;
        }

        .search:focus {
            border-color: #6366f1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            color: #64748b;
            font-size: 12px;
            padding: 13px;
            border-bottom: 1px solid #e5e7eb;
        }

        td {
            padding: 16px 13px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
        }

        .company {
            font-weight: 600;
        }

        .empty {
            text-align: center;
            padding: 45px;
            color: #94a3b8;
        }

        /* RESPONSIVE */

        @media (max-width: 900px) {

            .sidebar {
                width: 210px;
            }

            .main {
                margin-left: 210px;
                padding: 25px;
            }

            .summary {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 650px) {

            .sidebar {
                display: none;
            }

            .main {
                margin-left: 0;
                padding: 20px;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .table-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .search {
                width: 100%;
            }

        }

    </style>

</head>

<body>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-logo">
                V
            </div>

            <div class="brand-text">
                VendorOS <span>AI</span>
            </div>

        </div>


        <div class="nav-section">

            <div class="nav-label">
                Workspace
            </div>


            <a href="dashboard.html" class="nav-item">

                <span class="nav-icon">▦</span>

                Dashboard

            </a>


            <a href="inventory.html" class="nav-item">

                <span class="nav-icon">▣</span>

                Inventory

            </a>


            <a href="sales.html" class="nav-item">

                <span class="nav-icon">▤</span>

                Sales & Billing

            </a>


            <a href="customers.html" class="nav-item">

                <span class="nav-icon">♙</span>

                Customers

            </a>


            <a href="suppliers.html" class="nav-item active">

                <span class="nav-icon">♧</span>

                Suppliers

            </a>


            <a href="ai-insights.html" class="nav-item">

                <span class="nav-icon">◈</span>

                AI Insights

            </a>

        </div>


        <div class="sidebar-bottom">

            <div
                class="nav-item logout"
                id="logoutButton"
                onclick="logoutUser()"
            >

                <span class="nav-icon">↪</span>

                Logout

            </div>

        </div>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="main">

        <div class="topbar">

            <div class="title">

                <h1>
                    Suppliers
                </h1>

                <p>
                    Manage your suppliers and business partners
                </p>

            </div>


            <button
                class="add-btn"
                onclick="openSupplierModal()"
            >
                + Add Supplier
            </button>

        </div>


        <!-- SUMMARY -->

        <section class="summary">

            <div class="card">

                <div class="card-label">
                    Total Suppliers
                </div>

                <div
                    class="card-value"
                    id="totalSuppliers"
                >
                    0
                </div>

            </div>


            <div class="card">

                <div class="card-label">
                    Companies
                </div>

                <div
                    class="card-value"
                    id="totalCompanies"
                >
                    0
                </div>

            </div>


            <div class="card">

                <div class="card-label">
                    Active Contacts
                </div>

                <div
                    class="card-value"
                    id="activeContacts"
                >
                    0
                </div>

            </div>

        </section>


        <!-- SUPPLIER TABLE -->

        <section class="table-card">

            <div class="table-header">

                <h2>
                    Supplier Directory
                </h2>


                <input
                    type="text"
                    id="searchSupplier"
                    class="search"
                    placeholder="Search suppliers..."
                >

            </div>


            <div id="supplierTableContainer">

                <div class="empty">
                    Loading suppliers...
                </div>

            </div>

        </section>

    </main>


    <script src="suppliers.js"></script>

</body>

</html>
```
